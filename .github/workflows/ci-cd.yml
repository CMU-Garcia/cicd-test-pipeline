name: Wheel CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# The starter reads code and publishes workflow artifacts; it needs no cloud secrets.
permissions:
  contents: read

concurrency:
  group: wheel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  ci:
    name: Test and package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pin actions to commits; the version comments make updates easier to teach.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            pyproject.toml
      - name: Install development tools and app
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install --no-build-isolation -e .
      - name: Check code and formatting
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Run tests and coverage gate
        run: >-
          python -m pytest --cov --cov-report=term-missing
          --cov-report=xml:coverage.xml --junitxml=test-results/junit.xml
      - name: Save test reports, including failed tests
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: |
            test-results/
            coverage.xml
          retention-days: 14
          if-no-files-found: warn
      - name: Build wheel once and record release identity
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: python scripts/release.py build
      - name: Verify the installed wheel, away from source code
        run: >-
          python scripts/release.py deploy --artifact-dir dist
          --target "${{ runner.temp }}/candidate"
      - name: Publish deployable wheel and manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-release
          path: dist/
          retention-days: 14
          if-no-files-found: error

  staging:
    name: Deploy wheel to staging sandbox
    needs: ci
    # Feature branches and PRs get CI; only main can reach the staging environment.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download this run's wheel; do not rebuild
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel-release
          path: dist
      - name: Install the verified wheel and smoke-test staging
        run: >-
          python scripts/release.py deploy --artifact-dir dist
          --target "${{ runner.temp }}/staging"
      - name: Save staging deployment receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-receipt
          path: ${{ runner.temp }}/staging/installed-release.json
          retention-days: 14
          if-no-files-found: error
